input {
  gelf {
    port => 12201
    type => gelf
  }
}

filter {
  mutate {
    rename => { "level" => "gelf_level" }
  }
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}
