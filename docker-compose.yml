services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notifier
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  elasticsearch:
    image: elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: kibana:8.13.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  logstash:
    image: logstash:8.13.0
    ports:
      - "12201:12201/udp"
    volumes:
      - ./config/logstash/pipeline.conf:/usr/share/logstash/pipeline/pipeline.conf:z
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - LS_LOG_LEVEL=error
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/_node/stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:z

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:z
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  subscription-service:
    build: ./subscription-service
    ports:
      - "8080:8080"
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-notifier}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@github-notifier.com}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-secret}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  notification-service:
    build: ./notification-service
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
    env_file:
      - path: .env
        required: false
    environment:
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8080
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@github-notifier.com}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-internal-secret}
    depends_on:
      subscription-service:
        condition: service_healthy

  e2e:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    profiles: [e2e]
    network_mode: host
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e:z
      - /e2e/node_modules
    environment:
      BASE_URL: http://localhost:8080
    command: sh -c "npm ci && npx playwright test"
    depends_on:
      subscription-service:
        condition: service_healthy

volumes:
  pgdata:
  esdata: